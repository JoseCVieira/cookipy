name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: make install-deps

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make test

      - name: Summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          r = ET.parse("junit.xml").getroot()
          s = r if r.tag == "testsuite" else r[0]
          print("### Tests")
          print(f"{s.get('tests')} tests, {s.get('failures')} failed, "
                f"{s.get('errors')} errors, {s.get('skipped')} skipped, "
                f"{float(s.get('time')):.1f}s")
          EOF
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
